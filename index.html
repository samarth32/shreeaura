<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Basic SEO -->
  <title>ShreeAura | Official Website</title>
  <meta name="description" content="Welcome to ShreeAura. Discover our premium services, exclusive products, and experience excellence." />
  <meta name="keywords" content="ShreeAura, Shree Aura, shreeaura.com, Official ShreeAura" />

  <meta name="google-site-verification" content="YOUR_GOOGLE_SEARCH_CONSOLE_VERIFICATION_CODE_HERE" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://shreeaura.com/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://shreeaura.com/" />
  <meta property="og:title" content="ShreeAura | Official Website" />
  <meta property="og:description" content="Welcome to ShreeAura. Discover our premium services, exclusive products, and experience excellence." />
  <meta property="og:site_name" content="ShreeAura" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />

  <meta property="twitter:title" content="ShreeAura | Official Website" />
  <meta property="twitter:description" content="Welcome to ShreeAura. Discover our premium services, exclusive products, and experience excellence." />

  <!-- JSON-LD SEO Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ShreeAura",
      "alternateName": ["Shree Aura"],
      "url": "https://shreeaura.com/"
    }
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "name": "ShreeAura",
      "url": "https://shreeaura.com/",
      "logo": "https://shreeaura.com/favicon.svg"
    }
  </script>

  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }
  </style>
</head>
