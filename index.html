<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Basic SEO -->
  <title>ShreeAura | Official Website</title>
  <meta name="description"
    content="Custom software, web, and mobile app development for businesses in Ahmedabad and beyond — from ShreeAura Trade and Solutions LLP." />
  <meta name="keywords" content="ShreeAura, Shree Aura, shreeaura.com, Official ShreeAura" />
  <meta name="author" content="ShreeAura" />
  <!-- <meta name="google-site-verification" content="YOUR_GOOGLE_SEARCH_CONSOLE_VERIFICATION_CODE_HERE" /> -->

  <!-- Canonical URL — updated per-route at runtime by src/app/components/Root.tsx -->
  <link rel="canonical" href="https://www.shreeaura.com/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.shreeaura.com/" />
  <meta property="og:title" content="ShreeAura | Custom Software Development in Ahmedabad" />
  <meta property="og:description"
    content="Custom software, web, and mobile app development for businesses in Ahmedabad and beyond — from ShreeAura Trade and Solutions LLP." />
  <meta property="og:site_name" content="ShreeAura" />
  <meta property="og:image" content="https://www.shreeaura.com/logo.png" />
  <meta property="og:image:width" content="2000" />
  <meta property="og:image:height" content="2000" />
  <meta property="og:image:alt" content="ShreeAura logo" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://www.shreeaura.com/" />
  <meta property="twitter:title" content="ShreeAura | Custom Software Development in Ahmedabad" />
  <meta property="twitter:description"
    content="Custom software, web, and mobile app development for businesses in Ahmedabad and beyond — from ShreeAura Trade and Solutions LLP." />
  <meta property="twitter:image" content="https://www.shreeaura.com/logo.png" />
  <meta property="twitter:image:alt" content="ShreeAura logo" />

  <!-- JSON-LD SEO Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ShreeAura",
      "alternateName": ["Shree Aura"],
      "url": "https://www.shreeaura.com/"
    }
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ShreeAura",
      "url": "https://www.shreeaura.com/",
      "logo": "https://www.shreeaura.com/favicon.svg"
    }
  </script>

  <!-- Icons -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
